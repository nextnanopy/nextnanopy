# Downloads the free nextnano portable build from the URL held in the
# NEXTNANO_FREE_PORTABLE_LINK secret, unzips it, installs nextnanopy from this
# checkout and points its config at the extracted build.
#
# Triggers: manual dispatch; a daily run that is skipped unless the repo changed
# in the last 24h; and a weekly Monday run that always executes, so a newly
# published portable build is exercised even during a quiet week.


name: download and test nextnano portable

on:
  workflow_dispatch:
  schedule:
    # Once a day at 03:00 UTC. The `gate` job decides what actually runs: always
    # on Mondays (the weekly build-drift check), and on other days only if the
    # repo changed in the last 24 hours.
    - cron: '0 3 * * *'

jobs:
  # Cheap Linux gate that decides whether the expensive Windows job runs, so a
  # skipped day never spins up a Windows runner or downloads the build.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"          # manual dispatch: always run
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"          # Monday: weekly run, always
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 86400 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"          # other days: repo changed in last 24h
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 24h; skipping today's run."
          fi

  download:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest

    steps:
      # Checkout first: actions/checkout cleans the workspace by default, which
      # would delete the downloaded zip if it ran afterwards.
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install nextnanopy
        run: pip install -e .

      # shell: cmd so `curl` is the real curl.exe. Under the default PowerShell
      # shell `curl` is an alias for Invoke-WebRequest and would not accept these
      # flags. The URL is passed through the environment to keep it off the
      # command line.
      - name: Download portable zip
        shell: cmd
        env:
          PORTABLE_URL: ${{ secrets.NEXTNANO_FREE_PORTABLE_LINK }}
        run: curl -L -o output.zip "%PORTABLE_URL%"

      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path output.zip -DestinationPath nextnano -Force

      - name: List extracted files
        shell: pwsh
        run: Get-ChildItem -Recurse nextnano | Select-Object -First 50

      - name: Set up nextnano config
        run: python scripts/setup_nextnano_config.py

      # Guard that the bundled demo we execute is still identical to the one
      # shipped in the portable build, so the smoke test tracks the canonical
      # example instead of a drifted copy.
      - name: Check demo input matches shipped example
        run: python scripts/check_demo_matches.py

      # execute() is told to raise on non-convergence (convergence_check_mode
      # "terminate"), so a failed run exits non-zero and fails this step.
      - name: Run test input file
        run: python templates/execute_input_file.py

      # Same smoke test for a parameter sweep over the same demo: every
      # generated input file is executed with convergence_check_mode
      # "terminate", so any non-converging run in the sweep fails this step.
      - name: Run test sweep
        run: python templates/sweep_example.py
