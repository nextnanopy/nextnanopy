# This workflow installs the package with its dev extras and runs the tests on
# every supported OS and Python version (see requires-python in pyproject.toml).


name: python test multiplatform

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      # Report every broken combination in one run, not just the first.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Installs the package itself, so the dependency list stays single-sourced in
    # pyproject.toml and importlib.metadata can resolve nextnanopy.__version__.
    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Test with pytest
      run: python -m pytest tests
