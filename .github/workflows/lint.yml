# This workflow lints and format-checks the source with ruff, using the rules in ruff.toml


name: ruff

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # Lets the release pipeline reuse this as a gate (see python-publish.yml).
  workflow_call:

jobs:
  ruff:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install ruff
      run: pip install ruff==0.15.21

    - name: Lint with ruff
      run: ruff check --output-format=github .

    # Runs even if the lint step failed, so a PR sees both sets of problems at once.
    - name: Check formatting with ruff
      if: always()
      run: ruff format --check --diff .
